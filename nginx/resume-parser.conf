# ================================================================
# Nginx reverse-proxy configuration for Resume Parser
#
# Path-based routing with SSL termination:
#   https://kprmtglobalsolutions.duckdns.org/        → production  (localhost:8000)
#   https://kprmtglobalsolutions.duckdns.org/dev/     → development (localhost:8002)
#   https://kprmtglobalsolutions.duckdns.org/uat/     → UAT         (localhost:8001)
#
# Install:  Copy to /etc/nginx/sites-available/resume-parser
#           ln -s /etc/nginx/sites-available/resume-parser /etc/nginx/sites-enabled/
#           rm /etc/nginx/sites-enabled/default  (remove default site)
#           nginx -t && systemctl reload nginx
# ================================================================

# ── Redirect HTTP to HTTPS ────────────────────────────────────
server {
    listen 80;
    server_name kprmtglobalsolutions.duckdns.org;

    # Let's Encrypt ACME challenge (certbot uses this for renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Everything else → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS server ─────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name kprmtglobalsolutions.duckdns.org;

    # ── SSL certificates (managed by certbot) ────────────────
    ssl_certificate     /etc/letsencrypt/live/kprmtglobalsolutions.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kprmtglobalsolutions.duckdns.org/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ─────────────────────────────────────
    add_header X-Frame-Options       "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff"    always;
    add_header Referrer-Policy       "strict-origin-when-cross-origin" always;

    # ── Common proxy settings ────────────────────────────────
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";

    # Max upload size (for resume uploads)
    client_max_body_size 50M;

    # ── Timeouts (some parsing operations are slow) ──────────
    proxy_connect_timeout 120s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    # ==============================================================
    # DEV environment  →  localhost:8002
    # ==============================================================
    location /dev/ {
        # Trailing slash on proxy_pass strips the /dev/ prefix
        proxy_pass http://127.0.0.1:8002/;
    }

    # ==============================================================
    # UAT environment  →  localhost:8001
    # ==============================================================
    location /uat/ {
        # Trailing slash on proxy_pass strips the /uat/ prefix
        proxy_pass http://127.0.0.1:8001/;
    }

    # ==============================================================
    # PRODUCTION (root)  →  localhost:8000
    # ==============================================================
    location / {
        proxy_pass http://127.0.0.1:8000;
    }
}
