server {
    listen 80;
    server_name _;

    # Allow resume uploads up to 50 MB
    client_max_body_size 50M;

    # Timeouts to prevent premature 502 errors
    proxy_connect_timeout 30s;
    proxy_read_timeout 200s;
    proxy_send_timeout 200s;

    # Custom error page for 502/503/504
    error_page 502 503 504 /custom_50x.html;
    location = /custom_50x.html {
        internal;
        default_type text/html;
        return 503 '<!DOCTYPE html><html><head><title>Service Temporarily Unavailable</title><style>body{font-family:Arial,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;background:#f8fafc;color:#334155}div{text-align:center;padding:40px}.spinner{width:40px;height:40px;border:4px solid #e2e8f0;border-top:4px solid #6366f1;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 20px}@keyframes spin{to{transform:rotate(360deg)}}</style></head><body><div><div class="spinner"></div><h2>Service is starting up...</h2><p>The application is loading. Please refresh in a few seconds.</p><script>setTimeout(function(){location.reload()},10000)</script></div></body></html>';
    }

    # PROD - port 8000
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # UAT - port 8001
    location /uat/ {
        proxy_pass http://127.0.0.1:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # DEV - port 8002
    location /dev/ {
        proxy_pass http://127.0.0.1:8002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
