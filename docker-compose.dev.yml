# ================================================================
# docker-compose.dev.yml  –  DEV environment overrides
# Usage:
#   docker compose -p resume-dev --env-file .env.dev \
#     -f docker-compose.yml -f docker-compose.dev.yml \
#     up -d --build
# ================================================================
services:

  database:
    container_name: resume-db-dev

  ingestion:
    container_name: resume-ingestion-dev
    restart: unless-stopped
    depends_on:
      - ollama

  api:
    container_name: resume-api-dev
    build:
      args:
        BASE_PATH: /dev
        VITE_API_BASE_URL: /dev
    ports:
      - "8002:8000"
    restart: unless-stopped
    depends_on:
      - ollama

  # ── Ollama local LLM (dev only) ───────────────────────────
  ollama:
    image: ollama/ollama
    container_name: ollama-dev
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - resume-network

volumes:
  ollama_data:
