<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KPRMT - LinkedIn Extractor</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- LOGIN SCREEN -->
  <div id="login-screen" class="screen">
    <div class="header">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1a56db" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span class="logo-text">KPRMT</span>
      </div>
      <span class="subtitle">LinkedIn Profile Extractor</span>
    </div>

    <div class="form-group">
      <label for="api-url">API Server URL</label>
      <input type="url" id="api-url" placeholder="https://kprmtglobalsolutions.duckdns.org/dev" value="https://kprmtglobalsolutions.duckdns.org/dev">
    </div>
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="Enter username">
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter password">
    </div>
    <button id="btn-login" class="btn btn-primary btn-full">Login</button>
    <div id="login-error" class="error-msg hidden"></div>
  </div>

  <!-- MAIN SCREEN -->
  <div id="main-screen" class="screen hidden">
    <div class="header">
      <div class="header-row">
        <div class="logo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1a56db" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <span class="logo-text">KPRMT</span>
        </div>
        <div class="header-actions">
          <span id="rate-limit" class="rate-badge" title="Daily submissions used">0/50</span>
          <button id="btn-settings" class="btn btn-sm btn-ghost" title="Settings" style="padding:4px 8px;">&#9881;</button>
          <button id="btn-logout" class="btn btn-sm btn-ghost" title="Logout">Logout</button>
        </div>
      </div>
    </div>

    <!-- Status Bar -->
    <div id="status-bar" class="status-bar">
      <span id="status-icon" class="status-icon">●</span>
      <span id="status-text">Navigate to a LinkedIn profile to extract data</span>
    </div>

    <!-- Extract Button -->
    <button id="btn-extract" class="btn btn-primary btn-full">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="8 17 12 21 16 17"/>
        <line x1="12" y1="12" x2="12" y2="21"/>
        <path d="M20.88 18.09A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.29"/>
      </svg>
      Extract Profile
    </button>

    <!-- Extracted Data Preview -->
    <div id="preview-section" class="preview hidden">
      <h3 class="section-title">Extracted Profile</h3>

      <div class="profile-card">
        <div class="profile-avatar" id="avatar">JD</div>
        <div class="profile-info">
          <div class="profile-name" id="preview-name">--</div>
          <div class="profile-title" id="preview-title">--</div>
          <div class="profile-location" id="preview-location">--</div>
        </div>
      </div>

      <div class="data-grid">
        <div class="data-item">
          <label>Email</label>
          <input type="email" id="edit-email" class="edit-field" placeholder="Not found - enter manually">
        </div>
        <div class="data-item">
          <label>Phone</label>
          <input type="tel" id="edit-phone" class="edit-field" placeholder="Not found - enter manually">
        </div>
        <div class="data-item">
          <label>Company</label>
          <span id="preview-company" class="data-value">--</span>
        </div>
        <div class="data-item">
          <label>Experience</label>
          <span id="preview-experience" class="data-value">--</span>
        </div>
      </div>

      <!-- Skills -->
      <div class="collapsible">
        <div class="collapsible-header" data-target="skills-list">
          <span>Skills</span>
          <span id="skills-count" class="count-badge">0</span>
        </div>
        <div id="skills-list" class="collapsible-body hidden">
          <div id="skills-tags" class="tags-container"></div>
        </div>
      </div>

      <!-- Experience -->
      <div class="collapsible">
        <div class="collapsible-header" data-target="exp-list">
          <span>Work Experience</span>
          <span id="exp-count" class="count-badge">0</span>
        </div>
        <div id="exp-list" class="collapsible-body hidden">
          <div id="exp-items"></div>
        </div>
      </div>

      <!-- Education -->
      <div class="collapsible">
        <div class="collapsible-header" data-target="edu-list">
          <span>Education</span>
          <span id="edu-count" class="count-badge">0</span>
        </div>
        <div id="edu-list" class="collapsible-body hidden">
          <div id="edu-items"></div>
        </div>
      </div>

      <!-- Add to List Button -->
      <button id="btn-add-to-list" class="btn btn-success btn-full">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="8.5" cy="7" r="4"/>
          <line x1="20" y1="8" x2="20" y2="14"/>
          <line x1="23" y1="11" x2="17" y2="11"/>
        </svg>
        Add to List
      </button>
    </div>

    <!-- Success Message -->
    <div id="success-msg" class="success-msg hidden">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
        <polyline points="22 4 12 14.01 9 11.01"/>
      </svg>
      <span id="success-text">Added to People Search!</span>
    </div>

    <!-- Error Message -->
    <div id="error-msg" class="error-msg hidden"></div>

    <!-- Settings Panel -->
    <div id="settings-panel" class="hidden" style="background:#f1f5f9;border:1px solid #e2e8f0;border-radius:8px;padding:12px;margin-top:8px;">
      <div style="font-weight:600;margin-bottom:8px;color:#374151;">Settings</div>
      <label style="font-size:11px;color:#6b7280;display:block;margin-bottom:4px;">API Server URL</label>
      <input type="url" id="settings-api-url" style="width:100%;border:1px solid #d1d5db;border-radius:6px;padding:6px 8px;font-size:12px;margin-bottom:8px;" placeholder="https://kprmtglobalsolutions.duckdns.org/dev">
      <button id="btn-save-settings" class="btn btn-primary btn-full" style="font-size:12px;padding:6px;">Save URL</button>
      <div id="settings-msg" style="font-size:11px;margin-top:6px;color:#16a34a;display:none;">Saved!</div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
